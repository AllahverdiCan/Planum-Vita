function useLocalStorage(k, init) {
  const [v, setV] = useState(()=>{try{const i=window.localStorage.getItem(k);return i?JSON.parse(i):init;}catch(e){return init;}});
  const sV = (nv) => {try{const ns=nv instanceof Function?nv(v):nv;setV(ns);window.localStorage.setItem(k,JSON.stringify(ns));}catch(e){}};
  return [v, sV];
}

function triggerConfetti(){
  const c=document.createElement('canvas');c.style.position='fixed';c.style.inset='0';c.style.width='100vw';c.style.height='100vh';c.style.pointerEvents='none';c.style.zIndex='9999';document.body.appendChild(c);
  const cx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight;
  const pA=Array.from({length:65}).map(()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-0.5)*16,vy:(Math.random()-0.5)*16-4,s:Math.random()*7+4,c:['#6366f1','#10b981','#f59e0b','#f43f5e','#06b6d4'][Math.floor(Math.random()*5)],a:1,d:Math.random()*0.02+0.015}));
  function an(){cx.clearRect(0,0,c.width,c.height);let al=false;pA.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.a-=p.d;if(p.a>0){al=true;cx.save();cx.globalAlpha=p.a;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);cx.restore();}});if(al)requestAnimationFrame(an);else c.remove();}an();
}
